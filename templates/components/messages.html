{% load i18n %}
{% if messages %}
<div class="container mt-3 messages-wrap" role="status" aria-live="polite">
    {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} alert-dismissible fade show d-flex align-items-center gap-2" role="alert">
        {% if message.tags == 'success' %}<i class="bi bi-check-circle-fill" aria-hidden="true"></i>
        {% elif message.tags == 'error' or message.tags == 'danger' %}<i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
        {% elif message.tags == 'warning' %}<i class="bi bi-exclamation-circle-fill" aria-hidden="true"></i>
        {% else %}<i class="bi bi-info-circle-fill" aria-hidden="true"></i>{% endif %}
        <span>{{ message }}</span>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="{% trans 'Tutup' %}"></button>
    </div>
    {% endfor %}
</div>
{% endif %}
