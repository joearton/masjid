{% load i18n %}
<div class="topbar">
    <button class="btn btn-sm btn-outline-secondary d-lg-none" id="sidebarToggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="{% trans 'Buka menu' %}">
        <i class="bi bi-list fs-5" aria-hidden="true"></i>
    </button>
    <div class="topbar-breadcrumb">
        {% block breadcrumb %}
        <span class="text-muted">{{ page_title }}</span>
        {% endblock %}
    </div>
    <div class="topbar-right d-flex align-items-center gap-3">
        <div class="dropdown">
            <a href="{% url 'core:home' %}" target="_blank" rel="noopener" class="btn btn-sm btn-light d-none d-sm-inline-flex align-items-center gap-1 me-1"><i class="bi bi-box-arrow-up-right" aria-hidden="true"></i>{% trans "Lihat Website" %}</a>
            <button class="btn btn-sm d-inline-flex align-items-center gap-2" data-bs-toggle="dropdown" aria-expanded="false">
                <div class="avatar-sm">{{ user.username|first|upper }}</div>
                <span class="d-none d-md-inline fw-medium">{{ user.get_full_name|default:user.username }}</span>
                <i class="bi bi-chevron-down small"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><span class="dropdown-item-text text-muted small">{{ user.email }}</span></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form method="post" action="{% url 'panel:logout' %}" class="m-0">{% csrf_token %}
                        <button type="submit" class="dropdown-item text-danger">
                            <i class="bi bi-box-arrow-right me-2"></i>{% trans "Keluar" %}
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</div>
