<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Monitor · {{ nama }}</title>
    <style>
        html, body { margin: 0; height: 100%; background: #0f172a; overflow: hidden; }
        iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #0f172a; }
    </style>
</head>
<body>
    {# Bingkai luar: layar penuh dipasang di sini, jadi tetap bertahan saat isi monitor memuat ulang #}
    <iframe id="monitor" src="{{ embed_url }}" title="Monitor {{ nama }}" allow="fullscreen; autoplay; screen-wake-lock" allowfullscreen></iframe>
    <script>
        // Layar tetap menyala dari bingkai luar (bertahan walau isi dimuat ulang)
        (function () {
            async function keepAwake() {
                try { if ('wakeLock' in navigator && document.visibilityState === 'visible') await navigator.wakeLock.request('screen'); } catch (e) {}
            }
            document.addEventListener('visibilitychange', keepAwake);
            keepAwake();
        })();
    </script>
</body>
</html>
